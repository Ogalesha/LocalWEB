name: macOS smoke

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/ci/**"
      - ".github/workflows/macos-smoke.yml"
  workflow_dispatch:

concurrency:
  group: macos-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: cargo check and portable tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace compiles on Darwin
        run: cargo check --workspace --all-targets
      - name: Platform-independent tests
        run: |
          set -o pipefail
          cargo test --no-fail-fast -p localweb-core -p localweb-gui 2>&1 | tee "$RUNNER_TEMP/localweb-tests.log"
      - name: Report failing tests
        if: failure()
        run: |
          grep -E '^(test .* FAILED|failures:|---- .* stdout ----|thread .* panicked|assertion .* failed)' \
            "$RUNNER_TEMP/localweb-tests.log" | head -40 | while IFS= read -r line; do
            echo "::error title=macOS test failure::$line"
          done
