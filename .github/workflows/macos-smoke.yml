name: macOS smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: cargo check and portable tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Workspace compiles on Darwin
        run: cargo check --workspace --all-targets
      - name: Check native code quality
        run: cargo clippy --workspace --all-targets --color never --message-format=json -- -D warnings > "$RUNNER_TEMP/localweb-clippy.jsonl"
      - name: Report native Rust diagnostics
        if: always()
        run: python3 .github/ci/report-rust-diagnostics.py "$RUNNER_TEMP/localweb-clippy.jsonl"
      - name: Workspace regression tests
        run: |
          set -o pipefail
          cargo test --workspace --all-targets --no-fail-fast 2>&1 | tee "$RUNNER_TEMP/localweb-tests.log"
      - name: Report failing tests
        if: failure()
        run: |
          test -f "$RUNNER_TEMP/localweb-tests.log" || exit 0
          grep -E '^(test .* FAILED|failures:|---- .* stdout ----|thread .* panicked|text .* overflows|assertion .* failed)' \
            "$RUNNER_TEMP/localweb-tests.log" | head -40 | while IFS= read -r line; do
            echo "::error title=macOS test failure::$line"
          done
